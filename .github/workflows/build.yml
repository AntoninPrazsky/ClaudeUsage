name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Determine version
        id: ver
        shell: pwsh
        run: |
          $v = "0.0.0-dev"
          if ("${{ github.ref }}" -like "refs/tags/v*") { $v = "${{ github.ref_name }}".TrimStart("v") }
          "version=$v" | Out-File -Append -Encoding utf8 $env:GITHUB_OUTPUT
          Write-Host "Version: $v"

      - name: Publish
        run: >
          dotnet publish ClaudeUsage.csproj -c Release -r win-x64
          -p:SelfContained=false -p:PublishSingleFile=true
          -p:Version=${{ steps.ver.outputs.version }}
          -o publish

      - name: Checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash publish/ClaudeUsage.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  ClaudeUsage.exe" | Out-File -Encoding ascii publish/ClaudeUsage.exe.sha256
          Get-Content publish/ClaudeUsage.exe.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: ClaudeUsage
          path: |
            publish/ClaudeUsage.exe
            publish/ClaudeUsage.exe.sha256

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            publish/ClaudeUsage.exe
            publish/ClaudeUsage.exe.sha256
          generate_release_notes: true
